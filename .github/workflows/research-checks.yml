name: Research integration checks
on:
  push:
    branches: [main, life-sciences-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './integrations/research-tools[mcp,test]' -r life-sciences/requirements.txt
      - run: python validate.py
      - run: python -m unittest discover -s tests
      - run: git diff --check
