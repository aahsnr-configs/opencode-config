[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-research-tools"
version = "0.1.0"
description = "Zotero access and resumable research and learning state for OpenCode"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
test = ["jsonschema>=4.23,<5", "PyYAML>=6,<7", "json5>=0.10,<1"]

[project.scripts]
opencode-research-tools = "opencode_research_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
